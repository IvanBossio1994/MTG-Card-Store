tutorial.s1.title=Connect your store
tutorial.s1.p1=In "Settings" you enter your name, logo, private Google credentials, cache folder, pricing rule and the Google Sheet the app will use.
tutorial.s1.p2=The Sheet can be empty or already have cards. If it has an existing tab, the app looks for card names in any column and creates a new tab with the inventory columns, without touching the original.
tutorial.s1.p3=Before syncing, attach this installation’s google-credentials.json and share your Google Sheet as <strong>Editor</strong> with this email:
tutorial.s2.title=Sync once when you open
tutorial.s2.p1=Sync inventory reads the Sheet, prepares the app tab, sorts the inventory and recalculates prices with Card Kingdom.
tutorial.s2.p2=After syncing, the button disappears for that session and the table is ready to work with.
tutorial.s2.note=The first sync can take a while because it downloads Card Kingdom. After that it uses the local cache you chose in Settings.
tutorial.s3.title=Search and move stock
tutorial.s3.p1=On the home screen you can search by name, variation, set, code or number. Suggestions appear after 3 letters.
tutorial.s3.p2=Double-faced cards work with a slash, for example Fell the Profane / Fell Mire.
tutorial.s3.plus=Adds a new card or one more unit to stock.
tutorial.s3.minus=Records one unit sold and updates history and register.
tutorial.s4.title=Import big lists
tutorial.s4.p1=In "Import list" you can paste "Moxfield" exports or bulk-scan lists as plain text.
tutorial.s4.p2=The app marks each result as found, other version or not found. If there are alternatives, you can expand them and pick which ones to add to stock.
tutorial.s5.title=Check history and register
tutorial.s5.p1="History" keeps stock added and units sold by date. "Register" adds up the day’s sales at each card’s store price.
tutorial.s5.p2="Report" sums up by month how many cards were sold and how many came in.
tutorial.s5.note=Normal flow: sync when you open, search or import cards, use + and -, and check the register at the end of the day.

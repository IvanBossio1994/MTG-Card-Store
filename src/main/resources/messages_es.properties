tutorial.s1.title=Conectá tu tienda
tutorial.s1.p1=En "Configuración" cargás nombre, logo, credenciales privadas de Google, carpeta de cache, regla de precio y el Google Sheet que va a usar la app.
tutorial.s1.p2=El Sheet puede estar vacío o ya tener cartas. Si tiene una pestaña existente, la app busca nombres en cualquier columna y crea una pestaña nueva con las columnas del inventario sin pisar la original.
tutorial.s1.p3=Antes de sincronizar, adjuntá el google-credentials.json de esta instalación y compartí tu Google Sheet como <strong>Editor</strong> con este mail:
tutorial.s1.google1=En "Configuración" tocás "Conectar con Google", elegís tu cuenta y la app crea el Sheet del inventario en tu Drive. Después cargás nombre, logo y tu regla de precio.
tutorial.s1.google2=Solo pide permiso para ver tu mail y los archivos que crea ella. El resto de tu Drive sigue privado.
tutorial.s2.title=Sincronizá una vez al abrir
tutorial.s2.p1=Sincronizar inventario lee el Sheet, prepara la pestaña de la app, ordena el inventario y recalcula precios con Card Kingdom.
tutorial.s2.p2=Después de sincronizar, el botón desaparece durante esa sesión y queda la tabla lista para trabajar.
tutorial.s2.note=La primera sincronización puede tardar porque descarga Card Kingdom. Después usa el cache local que elegiste en Configuración.
tutorial.s3.title=Buscá y mové stock
tutorial.s3.p1=En Inicio podés buscar por nombre, variación, set, código o número. Desde 3 letras aparecen sugerencias para autocompletar.
tutorial.s3.p2=Las cartas duales funcionan con barra, por ejemplo Fell the Profane / Fell Mire.
tutorial.s3.plus=Agrega una carta nueva o sube una unidad al stock.
tutorial.s3.minus=Registra una unidad vendida y actualiza movimientos y caja.
tutorial.s4.title=Importá listas grandes
tutorial.s4.p1=En "Importar lista" podés pegar exports de "Moxfield" o listas de escaneo masivo en texto plano.
tutorial.s4.p2=La app marca cada resultado como encontrada, otra versión o no encontrada. Si hay alternativas, podés desplegarlas y elegir cuáles sumar al stock.
tutorial.s5.title=Revisá movimientos y caja
tutorial.s5.p1="Movimientos" guarda entradas y unidades vendidas por fecha. "Caja" suma las ventas del día con el precio local de cada carta.
tutorial.s5.p2="Reporte" resume por mes cuántas cartas se vendieron y cuántas entraron.
tutorial.s5.note=Flujo normal: sincronizar al abrir, buscar o importar cartas, usar + y -, y revisar caja al final del día.


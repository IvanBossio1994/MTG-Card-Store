tutorial.s1.title=Connectez votre boutique
tutorial.s1.p1=Dans « Paramètres », vous saisissez le nom, le logo, les identifiants Google privés, le dossier de cache, la règle de prix et le Google Sheet que l’application va utiliser.
tutorial.s1.p2=Le Sheet peut être vide ou contenir déjà des cartes. S’il a un onglet existant, l’application cherche des noms dans n’importe quelle colonne et crée un nouvel onglet avec les colonnes de l’inventaire, sans toucher à l’original.
tutorial.s1.p3=Avant de synchroniser, joignez le google-credentials.json de cette installation et partagez votre Google Sheet en tant qu’<strong>Éditeur</strong> avec cette adresse :
tutorial.s1.google1=Dans « Paramètres », touchez « Se connecter avec Google », choisissez votre compte et l’application crée le Sheet d’inventaire dans votre Drive. Ajoutez ensuite le nom, le logo et votre règle de prix.
tutorial.s1.google2=Elle demande seulement à voir votre e-mail et les fichiers qu’elle crée. Le reste de votre Drive reste privé.
tutorial.s2.title=Synchronisez une fois à l’ouverture
tutorial.s2.p1=Synchroniser l’inventaire lit le Sheet, prépare l’onglet de l’application, trie l’inventaire et recalcule les prix avec Card Kingdom.
tutorial.s2.p2=Après la synchronisation, le bouton disparaît pendant la session et le tableau est prêt.
tutorial.s2.note=La première synchronisation peut être longue car elle télécharge Card Kingdom. Ensuite, elle utilise le cache local choisi dans les Paramètres.
tutorial.s3.title=Recherchez et gérez le stock
tutorial.s3.p1=Sur l’accueil, vous pouvez chercher par nom, variante, extension, code ou numéro. Des suggestions apparaissent dès 3 lettres.
tutorial.s3.p2=Les cartes doubles fonctionnent avec une barre, par exemple Fell the Profane / Fell Mire.
tutorial.s3.plus=Ajoute une nouvelle carte ou une unité au stock.
tutorial.s3.minus=Enregistre une unité vendue et met à jour les mouvements et la caisse.
tutorial.s4.title=Importez de grandes listes
tutorial.s4.p1=Dans « Importer une liste », vous pouvez coller des exports « Moxfield » ou des listes de scan en masse en texte brut.
tutorial.s4.p2=L’application marque chaque résultat comme trouvée, autre version ou introuvable. S’il y a des alternatives, vous pouvez les déplier et choisir lesquelles ajouter au stock.
tutorial.s5.title=Consultez mouvements et caisse
tutorial.s5.p1=« Mouvements » garde les entrées et unités vendues par date. « Caisse » additionne les ventes du jour au prix boutique de chaque carte.
tutorial.s5.p2=« Rapport » résume par mois combien de cartes ont été vendues et combien sont entrées.
tutorial.s5.note=Routine normale : synchroniser à l’ouverture, chercher ou importer des cartes, utiliser + et -, et vérifier la caisse en fin de journée.

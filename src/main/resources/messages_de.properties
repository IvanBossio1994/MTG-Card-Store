tutorial.s1.title=Verbinde deinen Laden
tutorial.s1.p1=Unter „Einstellungen“ trägst du Name, Logo, private Google-Zugangsdaten, Cache-Ordner, Preisregel und das Google Sheet ein, das die App nutzen soll.
tutorial.s1.p2=Das Sheet kann leer sein oder schon Karten enthalten. Hat es einen bestehenden Tab, sucht die App in jeder Spalte nach Kartennamen und legt einen neuen Tab mit den Inventarspalten an, ohne das Original anzufassen.
tutorial.s1.p3=Hänge vor dem Synchronisieren die google-credentials.json dieser Installation an und teile dein Google Sheet als <strong>Bearbeiter</strong> mit dieser E-Mail:
tutorial.s2.title=Einmal beim Öffnen synchronisieren
tutorial.s2.p1=Inventar synchronisieren liest das Sheet, bereitet den App-Tab vor, sortiert das Inventar und berechnet die Preise mit Card Kingdom neu.
tutorial.s2.p2=Nach dem Synchronisieren verschwindet die Taste für diese Sitzung und die Tabelle ist bereit.
tutorial.s2.note=Die erste Synchronisierung kann dauern, weil Card Kingdom heruntergeladen wird. Danach nutzt sie den lokalen Cache, den du in den Einstellungen gewählt hast.
tutorial.s3.title=Suchen und Bestand bewegen
tutorial.s3.p1=Auf der Startseite kannst du nach Name, Variante, Set, Code oder Nummer suchen. Ab 3 Buchstaben erscheinen Vorschläge.
tutorial.s3.p2=Doppelseitige Karten funktionieren mit Schrägstrich, zum Beispiel Fell the Profane / Fell Mire.
tutorial.s3.plus=Fügt eine neue Karte oder eine Einheit zum Bestand hinzu.
tutorial.s3.minus=Bucht eine verkaufte Einheit und aktualisiert Bewegungen und Kasse.
tutorial.s4.title=Große Listen importieren
tutorial.s4.p1=Unter „Liste importieren“ kannst du „Moxfield“-Exporte oder Massenscan-Listen als reinen Text einfügen.
tutorial.s4.p2=Die App markiert jedes Ergebnis als gefunden, andere Version oder nicht gefunden. Gibt es Alternativen, kannst du sie aufklappen und auswählen, welche in den Bestand sollen.
tutorial.s5.title=Bewegungen und Kasse prüfen
tutorial.s5.p1=„Bewegungen“ speichert Zugänge und verkaufte Einheiten nach Datum. „Kasse“ summiert die Tagesverkäufe zum Ladenpreis jeder Karte.
tutorial.s5.p2=„Bericht“ fasst pro Monat zusammen, wie viele Karten verkauft wurden und wie viele hinzukamen.
tutorial.s5.note=Normaler Ablauf: beim Öffnen synchronisieren, Karten suchen oder importieren, + und - nutzen und am Ende des Tages die Kasse prüfen.

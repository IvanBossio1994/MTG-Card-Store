# Perfil e2e: para QA y desarrollo sin credenciales. Sin Google ni internet.
# - No se cargan los beans de la v1 (com.tcg.bot.legacy) ni de com.tcg.bot.google
#   (ver com.tcg.bot.compartido.ModoPruebaConfig): no hay descarga de Card Kingdom ni sincronizacion programada.
# - Cada modulo v2 usa su XEnMemoriaRepository (@Profile("e2e")) con datos de ejemplo.

# Datos locales aislados: nunca se usa data/.
app.storage-dir=./target/e2e-data
store.default-spreadsheet-id=

# Sin cliente OAuth de Google.
google.oauth.client-id=
google.oauth.client-secret=

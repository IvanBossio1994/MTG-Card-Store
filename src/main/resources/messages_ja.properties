tutorial.s1.title=お店を接続する
tutorial.s1.p1=「設定」で、店名、ロゴ、Google の非公開認証情報、キャッシュフォルダ、価格ルール、アプリが使う Google スプレッドシートを入力します。
tutorial.s1.p2=スプレッドシートは空でも、すでにカードが入っていても構いません。既存のタブがある場合、アプリはどの列からでもカード名を探し、元のタブには触れずに在庫用の列を持つ新しいタブを作成します。
tutorial.s1.p3=同期の前に、このインストールの google-credentials.json を添付し、Google スプレッドシートを次のメールアドレスと<strong>編集者</strong>として共有してください:
tutorial.s1.google1=「設定」で「Google で接続」をタップしてアカウントを選ぶと、アプリがあなたの Drive に在庫スプレッドシートを作成します。その後、店名、ロゴ、価格ルールを入力します。
tutorial.s1.google2=求める権限はメールアドレスと、アプリ自身が作成したファイルだけです。Drive のほかのファイルは見えません。
tutorial.s2.title=開いたら一度同期する
tutorial.s2.p1=「在庫を同期」はスプレッドシートを読み込み、アプリ用のタブを準備し、在庫を並べ替え、Card Kingdom で価格を再計算します。
tutorial.s2.p2=同期後、そのセッションではボタンが消え、テーブルが使える状態になります。
tutorial.s2.note=初回の同期は Card Kingdom をダウンロードするため時間がかかることがあります。その後は設定で選んだローカルキャッシュを使います。
tutorial.s3.title=検索と在庫の移動
tutorial.s3.p1=ホーム画面では名前、バリエーション、セット、コード、番号で検索できます。3文字入力すると候補が表示されます。
tutorial.s3.p2=両面カードはスラッシュで検索できます。例: Fell the Profane / Fell Mire。
tutorial.s3.plus=新しいカードを追加するか、在庫を1枚増やします。
tutorial.s3.minus=1枚の販売を記録し、履歴とレジを更新します。
tutorial.s4.title=大きなリストを取り込む
tutorial.s4.p1=「リストを取り込む」では、「Moxfield」のエクスポートや一括スキャンのリストをテキストとして貼り付けられます。
tutorial.s4.p2=アプリは各結果を「見つかった」「別バージョン」「見つからない」に分類します。候補がある場合は展開して、在庫に追加するものを選べます。
tutorial.s5.title=履歴とレジを確認する
tutorial.s5.p1=「履歴」は追加した在庫と販売した枚数を日付ごとに記録します。「レジ」はその日の売上を各カードの店頭価格で合計します。
tutorial.s5.p2=「レポート」は月ごとに販売したカードと入荷したカードの数をまとめます。
tutorial.s5.note=通常の流れ: 開いたら同期し、カードを検索または取り込み、+ と - を使い、一日の終わりにレジを確認します。

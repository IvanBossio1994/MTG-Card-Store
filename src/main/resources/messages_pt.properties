tutorial.s1.title=Conecte sua loja
tutorial.s1.p1=Em "Configurações" você coloca nome, logo, credenciais privadas do Google, pasta de cache, regra de preço e a Planilha Google que o app vai usar.
tutorial.s1.p2=A planilha pode estar vazia ou já ter cartas. Se tiver uma aba existente, o app procura nomes em qualquer coluna e cria uma aba nova com as colunas do estoque, sem mexer na original.
tutorial.s1.p3=Antes de sincronizar, anexe o google-credentials.json desta instalação e compartilhe sua Planilha Google como <strong>Editor</strong> com este e-mail:
tutorial.s1.google1=Em "Configurações", toque em "Conectar com Google", escolha sua conta e o app cria a planilha do inventário no seu Drive. Depois coloque nome, logo e sua regra de preço.
tutorial.s1.google2=Ele só pede permissão para ver seu e-mail e os arquivos que ele cria. O resto do seu Drive continua privado.
tutorial.s2.title=Sincronize uma vez ao abrir
tutorial.s2.p1=Sincronizar estoque lê a planilha, prepara a aba do app, organiza o estoque e recalcula os preços com a Card Kingdom.
tutorial.s2.p2=Depois de sincronizar, o botão some durante a sessão e a tabela fica pronta para trabalhar.
tutorial.s2.note=A primeira sincronização pode demorar porque baixa a Card Kingdom. Depois usa o cache local que você escolheu em Configurações.
tutorial.s3.title=Busque e movimente o estoque
tutorial.s3.p1=No Início você pode buscar por nome, variação, coleção, código ou número. A partir de 3 letras aparecem sugestões.
tutorial.s3.p2=Cartas duplas funcionam com barra, por exemplo Fell the Profane / Fell Mire.
tutorial.s3.plus=Adiciona uma carta nova ou soma uma unidade ao estoque.
tutorial.s3.minus=Registra uma unidade vendida e atualiza movimentações e caixa.
tutorial.s4.title=Importe listas grandes
tutorial.s4.p1=Em "Importar lista" você pode colar exportações do "Moxfield" ou listas de escaneamento em massa em texto simples.
tutorial.s4.p2=O app marca cada resultado como encontrada, outra versão ou não encontrada. Se houver alternativas, você pode abri-las e escolher quais somar ao estoque.
tutorial.s5.title=Confira movimentações e caixa
tutorial.s5.p1="Movimentações" guarda entradas e unidades vendidas por data. "Caixa" soma as vendas do dia com o preço da loja de cada carta.
tutorial.s5.p2="Relatório" resume por mês quantas cartas foram vendidas e quantas entraram.
tutorial.s5.note=Fluxo normal: sincronizar ao abrir, buscar ou importar cartas, usar + e -, e conferir o caixa no fim do dia.

tutorial.s1.title=Collega il tuo negozio
tutorial.s1.p1=In "Impostazioni" inserisci nome, logo, credenziali Google private, cartella della cache, regola di prezzo e il Google Sheet che l’app userà.
tutorial.s1.p2=Lo Sheet può essere vuoto o avere già delle carte. Se ha una scheda esistente, l’app cerca i nomi delle carte in qualsiasi colonna e crea una nuova scheda con le colonne dell’inventario, senza toccare l’originale.
tutorial.s1.p3=Prima di sincronizzare, allega il google-credentials.json di questa installazione e condividi il tuo Google Sheet come <strong>Editor</strong> con questa email:
tutorial.s1.google1=In "Impostazioni" tocca "Collega con Google", scegli il tuo account e l’app crea il foglio dell’inventario nel tuo Drive. Poi inserisci nome, logo e la tua regola di prezzo.
tutorial.s1.google2=Chiede solo di vedere la tua email e i file che crea lei. Il resto del tuo Drive resta privato.
tutorial.s2.title=Sincronizza una volta all’apertura
tutorial.s2.p1=Sincronizza inventario legge lo Sheet, prepara la scheda dell’app, ordina l’inventario e ricalcola i prezzi con Card Kingdom.
tutorial.s2.p2=Dopo la sincronizzazione, il pulsante scompare per quella sessione e la tabella è pronta all’uso.
tutorial.s2.note=La prima sincronizzazione può richiedere un po’ perché scarica Card Kingdom. Poi usa la cache locale scelta nelle Impostazioni.
tutorial.s3.title=Cerca e muovi lo stock
tutorial.s3.p1=Nella schermata iniziale puoi cercare per nome, variante, espansione, codice o numero. I suggerimenti appaiono dopo 3 lettere.
tutorial.s3.p2=Le carte bifronte funzionano con una barra, per esempio Fell the Profane / Fell Mire.
tutorial.s3.plus=Aggiunge una nuova carta o un’unità in più allo stock.
tutorial.s3.minus=Registra un’unità venduta e aggiorna storico e cassa.
tutorial.s4.title=Importa liste grandi
tutorial.s4.p1=In "Importa lista" puoi incollare esportazioni di "Moxfield" o liste di scansione massiva come testo semplice.
tutorial.s4.p2=L’app segna ogni risultato come trovato, altra versione o non trovato. Se ci sono alternative, puoi espanderle e scegliere quali aggiungere allo stock.
tutorial.s5.title=Controlla storico e cassa
tutorial.s5.p1="Storico" conserva lo stock aggiunto e le unità vendute per data. "Cassa" somma le vendite del giorno al prezzo negozio di ogni carta.
tutorial.s5.p2="Report" riassume per mese quante carte sono state vendute e quante sono entrate.
tutorial.s5.note=Flusso normale: sincronizza all’apertura, cerca o importa carte, usa + e -, e controlla la cassa a fine giornata.

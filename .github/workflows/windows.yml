name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión a publicar (ej. v0.9.0-beta.1). Vacío: solo arma el zip."
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "packaging/**"
      - "pom.xml"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Incluir el login con Google
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.TCG_GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TCG_GOOGLE_CLIENT_SECRET }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:CLIENT_ID -and $env:CLIENT_SECRET) {
            $lines = @("google.oauth.client-id=$env:CLIENT_ID", "google.oauth.client-secret=$env:CLIENT_SECRET")
            Set-Content -Path src/main/resources/google-oauth-bundled.properties -Value $lines -Encoding ascii
            Write-Host "Login con Google incluido."
          } elseif ($env:GITHUB_REF -like "refs/tags/*" -or $env:RELEASE_TAG) {
            Write-Error "Faltan los secretos TCG_GOOGLE_CLIENT_ID y TCG_GOOGLE_CLIENT_SECRET: sin ellos el login con Google no anda."
            exit 1
          } else {
            Write-Host "Sin secretos de Google: el armado sigue, pero sin login incluido."
          }

      - name: Compilar
        run: mvn -B -q package -DskipTests

      - name: Armar la app con Java incluido
        shell: pwsh
        run: |
          # La version sale del tag (v1.2.0 -> 1.2.0). Las compilaciones de prueba quedan como "dev" y no se actualizan solas.
          $version = "dev"
          $appVersion = "1.0.0"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
            $appVersion = $Matches[1]
          }
          $jar = Get-ChildItem target/*.jar | Where-Object { $_.Name -notlike "*plain*" } | Select-Object -First 1
          New-Item -ItemType Directory -Force input | Out-Null
          Copy-Item $jar.FullName input/app.jar
          jpackage --type app-image `
            --name TCGStoreHelper `
            --input input `
            --main-jar app.jar `
            --app-version $appVersion `
            --java-options "-Dspring.profiles.active=desktop" `
            --java-options "-Dapp.version=$version" `
            --java-options "-Dfile.encoding=UTF-8" `
            --win-console `
            --dest dist
          Copy-Item packaging/windows/LEEME.txt dist/TCGStoreHelper/
          Compress-Archive -Path dist/TCGStoreHelper -DestinationPath TCGStoreHelper-windows.zip
          # Huella del .zip: la app la usa para comprobar que la actualizacion se descargo entera.
          $hash = (Get-FileHash TCGStoreHelper-windows.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path TCGStoreHelper-windows.zip.sha256 -Value "$hash  TCGStoreHelper-windows.zip" -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: TCGStoreHelper-windows
          path: |
            TCGStoreHelper-windows.zip
            TCGStoreHelper-windows.zip.sha256

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # Desde "Run workflow" con una versión, crea el tag sobre el commit armado.
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            TCGStoreHelper-windows.zip
            TCGStoreHelper-windows.zip.sha256
          # Las versiones de prueba (v0.9.0-beta.1, etc.) salen como pre-release.
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
